name: Temporary F2FS Runtime Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-f2fs-runtime-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y f2fs-tools autoconf automake libtool pkg-config uuid-dev libselinux1-dev
      - name: Build and test recursive extractor
        run: |
          set -Eeuo pipefail
          git init /tmp/f2fs-tools
          git -C /tmp/f2fs-tools remote add origin https://android.googlesource.com/platform/external/f2fs-tools
          git -C /tmp/f2fs-tools fetch --depth 1 origin a9066a4e23ec95265941e69eed12a2c1306d1527
          git -C /tmp/f2fs-tools checkout --detach FETCH_HEAD
          cd /tmp/f2fs-tools
          ./autogen.sh >/dev/null
          ./configure >/dev/null
          make -j"$(nproc)" >/dev/null
          cp ./fsck/.libs/fsck.f2fs /tmp/dump.f2fs
          chmod 0755 /tmp/dump.f2fs
          usage="$(/tmp/dump.f2fs 2>&1 || true)"
          printf '%s\n' "$usage"
          grep -q -- '-r' <<< "$usage"
          grep -q -- '-o' <<< "$usage"
          grep -q -- '-P' <<< "$usage"
          grep -q -- '-L' <<< "$usage"
          image=/tmp/test.img
          output=/tmp/f2fs-out
          truncate -s 134217728 "$image"
          mkfs.f2fs -f -g android -l test "$image" >/dev/null
          mkdir -p "$output"
          /tmp/dump.f2fs -r -f -P -L -o "$output" "$image"
          echo 'F2FS recursive extractor passed'
