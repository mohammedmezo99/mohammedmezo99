name: Temporary F2FS CLI Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-f2fs-help-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check F2FS kernel support
        run: |
          set -Eeuo pipefail
          if grep -qw f2fs /proc/filesystems; then
            echo 'f2fs-kernel-support=present'
          else
            echo 'f2fs-kernel-support=missing'
            exit 1
          fi
