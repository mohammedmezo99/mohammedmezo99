name: Temporary F2FS CLI Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-f2fs-help-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y f2fs-tools autoconf automake libtool pkg-config uuid-dev libselinux1-dev
      - name: Build modern dump.f2fs
        run: |
          set -Eeuo pipefail
          git init /tmp/f2fs-tools
          git -C /tmp/f2fs-tools remote add origin https://android.googlesource.com/platform/external/f2fs-tools
          git -C /tmp/f2fs-tools fetch --depth 1 origin d34dcc887617535a0001ea389a2bb8058f41ea05
          git -C /tmp/f2fs-tools checkout --detach FETCH_HEAD
          cd /tmp/f2fs-tools
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          ./fsck/dump.f2fs -h 2>&1 || true
      - name: Verify recursive dump flags
        run: |
          set -Eeuo pipefail
          image=/tmp/empty-f2fs.img
          output=/tmp/f2fs-out
          truncate -s 134217728 "$image"
          mkfs.f2fs -f -g android -l test "$image"
          mkdir -p "$output"
          sudo /tmp/f2fs-tools/fsck/dump.f2fs -r -f -P -o "$output" "$image"
          test -d "$output"
          echo 'modern-dump-f2fs=passed'
