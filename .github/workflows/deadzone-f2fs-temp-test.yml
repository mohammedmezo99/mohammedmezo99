name: Temporary F2FS Capability Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-f2fs-temp-test.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Ubuntu F2FS packages
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y f2fs-tools android-sdk-platform-tools

      - name: Create and validate F2FS image
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/usr/lib/android-sdk/platform-tools:$PATH"
          image=/tmp/deadzone-f2fs-smoke.img
          truncate -s 134217728 "$image"
          make_f2fs -g android -l deadzone_test "$image"
          fsck.f2fs --dry-run "$image"
          file "$image"
          echo 'DeadZone F2FS image smoke test passed'
