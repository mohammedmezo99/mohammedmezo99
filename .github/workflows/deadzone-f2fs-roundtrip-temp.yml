name: Temporary F2FS Round Trip Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-f2fs-roundtrip-temp.yml'

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install F2FS toolchain
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y f2fs-tools android-sdk-platform-tools autoconf automake libtool pkg-config uuid-dev libselinux1-dev
      - name: Build recursive extractor
        run: |
          set -Eeuo pipefail
          git init /tmp/f2fs-tools
          git -C /tmp/f2fs-tools remote add origin https://android.googlesource.com/platform/external/f2fs-tools
          git -C /tmp/f2fs-tools fetch --depth 1 origin a9066a4e23ec95265941e69eed12a2c1306d1527
          git -C /tmp/f2fs-tools checkout --detach FETCH_HEAD
          cd /tmp/f2fs-tools
          ./autogen.sh >/dev/null
          ./configure >/dev/null
          make -j"$(nproc)" >/dev/null
          cp ./fsck/.libs/fsck.f2fs /tmp/dump.f2fs
          chmod 0755 /tmp/dump.f2fs
          export LD_LIBRARY_PATH=/tmp/f2fs-tools/lib/.libs
          usage="$(/tmp/dump.f2fs 2>&1 || true)"
          grep -q -- '-r' <<< "$usage"
          grep -q -- '-o' <<< "$usage"
          grep -q -- '-P' <<< "$usage"
          grep -q -- '-L' <<< "$usage"
      - name: Build and extract Android F2FS image
        run: |
          set -Eeuo pipefail
          export PATH="/usr/lib/android-sdk/platform-tools:$PATH"
          export LD_LIBRARY_PATH=/tmp/f2fs-tools/lib/.libs
          root=/tmp/f2fs-root
          image=/tmp/system.img
          output=/tmp/f2fs-out
          mkdir -p "$root/etc" "$root/bin" "$output"
          printf 'deadzone-f2fs-roundtrip\n' > "$root/etc/probe.txt"
          ln -s ../etc/probe.txt "$root/bin/probe_link"
          cat > /tmp/fs_config <<'EOF'
          system 0 0 0755
          system/etc 0 0 0755
          system/etc/probe.txt 0 0 0644
          system/bin 0 0 0755
          system/bin/probe_link 0 0 0777
          EOF
          sed -i 's/^          //' /tmp/fs_config
          printf '/system(/.*)? u:object_r:system_file:s0\n' > /tmp/file_contexts
          truncate -s 134217728 "$image"
          make_f2fs -g android -l system "$image" >/dev/null
          set +e
          sload_f2fs -C /tmp/fs_config -f "$root" -s /tmp/file_contexts -t /system "$image"
          rc=$?
          set -e
          [[ "$rc" -eq 0 || "$rc" -eq 1 ]]
          fsck.f2fs --dry-run "$image" >/dev/null
          fsck.f2fs -l "$image" 2>&1 | grep 'superblock features'
          /tmp/dump.f2fs -r -f -P -L -o "$output" "$image"
          test "$(cat "$output/etc/probe.txt")" = 'deadzone-f2fs-roundtrip'
          test -L "$output/bin/probe_link"
          test "$(readlink "$output/bin/probe_link")" = '../etc/probe.txt'
          echo 'F2FS round-trip passed'
