name: Temporary F2FS Metadata FS Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-f2fs-source-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test security xattrs on ext4 loop
        run: |
          set -Eeuo pipefail
          sudo apt-get update -y
          sudo apt-get install -y e2fsprogs attr libcap2-bin
          image=/tmp/deadzone-meta.ext4
          mountpoint=/tmp/deadzone-meta
          truncate -s 128M "$image"
          mkfs.ext4 -q -F "$image"
          mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo touch "$mountpoint/probe"
          sudo setfattr -n security.selinux -v 'u:object_r:system_file:s0' "$mountpoint/probe"
          sudo getfattr -n security.selinux --only-values "$mountpoint/probe"
          sudo setcap cap_net_bind_service=ep "$mountpoint/probe"
          sudo getcap "$mountpoint/probe"
          sudo umount "$mountpoint"
          echo 'ext4-security-xattrs=passed'
