name: Temporary F2FS Source Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadzone-f2fs-source-temp.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print recursive dump source
        run: |
          set -Eeuo pipefail
          git init /tmp/f2fs-tools
          git -C /tmp/f2fs-tools remote add origin https://android.googlesource.com/platform/external/f2fs-tools
          git -C /tmp/f2fs-tools fetch --depth 1 origin a9066a4e23ec95265941e69eed12a2c1306d1527
          git -C /tmp/f2fs-tools checkout --detach FETCH_HEAD
          sed -n '320,760p' /tmp/f2fs-tools/fsck/dump.c
