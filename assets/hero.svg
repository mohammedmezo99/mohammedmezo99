<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed MEZO — Android Systems Engineer</title>
  <desc id="desc">Professional dark blue and violet profile banner for Mohammed MEZO, founder of DeadZone ROM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#334155" stroke-width="1" opacity=".22"/>
    </pattern>
    <clipPath id="clip"><rect width="1400" height="460" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="460" fill="url(#bg)"/>
    <rect width="1400" height="460" fill="url(#grid)"/>
    <circle cx="210" cy="105" r="250" fill="url(#glowBlue)" filter="url(#blur)"/>
    <circle cx="1190" cy="365" r="290" fill="url(#glowPurple)" filter="url(#blur)"/>

    <path d="M0 380 C240 300 400 455 650 355 S1080 290 1400 365" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".4"/>
    <path d="M0 405 C250 330 430 472 670 385 S1090 320 1400 400" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".2"/>

    <g transform="translate(1030 68)" opacity=".9">
      <rect x="0" y="0" width="235" height="235" rx="42" fill="#020617" stroke="url(#accent)" stroke-width="2"/>
      <rect x="28" y="28" width="179" height="179" rx="29" fill="none" stroke="#334155"/>
      <path d="M72 161 V75 L118 116 L164 75 V161" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="118" cy="116" r="9" fill="#f8fafc"/>
      <text x="117.5" y="198" text-anchor="middle" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">DEADZONE</text>
    </g>

    <g transform="translate(100 94)">
      <rect x="0" y="0" width="152" height="32" rx="16" fill="#0f172a" stroke="#334155"/>
      <circle cx="18" cy="16" r="5" fill="#22c55e"/>
      <text x="31" y="21" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SYSTEMS ONLINE</text>

      <text x="0" y="112" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="900" letter-spacing="1">MOHAMMED MEZO</text>
      <rect x="0" y="136" width="760" height="5" rx="2.5" fill="url(#accent)"/>

      <text x="0" y="190" fill="#7dd3fc" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" letter-spacing="4">ANDROID SYSTEMS ENGINEER</text>
      <text x="0" y="234" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">AOSP • HyperOS • OnePlus • ODM Porting • ROM Automation</text>

      <g transform="translate(0 278)">
        <rect width="188" height="44" rx="22" fill="#172554" stroke="#2563eb"/>
        <text x="94" y="28" text-anchor="middle" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">DEADZONE FOUNDER</text>

        <rect x="204" width="172" height="44" rx="22" fill="#1e1b4b" stroke="#7c3aed"/>
        <text x="290" y="28" text-anchor="middle" fill="#ede9fe" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">ROM ENGINEERING</text>

        <rect x="392" width="185" height="44" rx="22" fill="#052e2b" stroke="#059669"/>
        <text x="484.5" y="28" text-anchor="middle" fill="#d1fae5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">BUILD AUTOMATION</text>
      </g>
    </g>

    <rect x="1" y="1" width="1398" height="458" rx="29" fill="none" stroke="#334155" stroke-width="2"/>
  </g>
</svg>
