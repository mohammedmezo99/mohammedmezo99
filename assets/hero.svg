<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed MEZO — DeadZone Android Systems</title>
  <desc id="desc">Animated cyber-style GitHub profile banner for Mohammed MEZO, Android systems engineer and founder of DeadZone ROM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#071b35"/>
      <stop offset="100%" stop-color="#130b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#60a5fa" stroke-width="1" opacity=".12"/>
    </pattern>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="clip"><rect width="1400" height="520" rx="32"/></clipPath>
    <style>
      .orbit { transform-origin: 1125px 245px; animation: spin 13s linear infinite; }
      .orbit2 { transform-origin: 1125px 245px; animation: spinBack 18s linear infinite; }
      .scan { animation: scan 4.8s ease-in-out infinite; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      .blink { animation: blink 1.1s steps(2,end) infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .dash { stroke-dasharray: 16 12; animation: dash 2.2s linear infinite; }
      .title { animation: titleGlow 3s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinBack { to { transform: rotate(-360deg); } }
      @keyframes scan { 0%,100% { transform: translateY(-90px); opacity:0; } 12%{opacity:.7} 60%{opacity:.35} 90%{transform:translateY(520px);opacity:0} }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      @keyframes blink { 0%,44%{opacity:1} 45%,100%{opacity:0} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
      @keyframes dash { to { stroke-dashoffset:-56; } }
      @keyframes titleGlow { 0%,100%{opacity:.92} 50%{opacity:1} }
      @media (prefers-reduced-motion: reduce) {
        .orbit,.orbit2,.scan,.pulse,.blink,.float,.dash,.title { animation:none!important; }
      }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="520" fill="url(#bg)"/>
    <rect width="1400" height="520" fill="url(#grid)"/>
    <circle cx="180" cy="70" r="300" fill="url(#glowA)" filter="url(#blur)">
      <animate attributeName="cx" values="150;330;150" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1210" cy="440" r="330" fill="url(#glowB)" filter="url(#blur)">
      <animate attributeName="cy" values="430;300;430" dur="10s" repeatCount="indefinite"/>
    </circle>

    <g opacity=".55">
      <path class="dash" d="M0 428 C235 340 400 508 690 390 S1110 350 1400 415" fill="none" stroke="url(#accent)" stroke-width="2"/>
      <path class="dash" d="M0 458 C230 380 430 522 715 425 S1120 380 1400 448" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".45"/>
    </g>

    <g transform="translate(86 74)">
      <g>
        <rect width="245" height="36" rx="18" fill="#071426" stroke="#1d4ed8"/>
        <circle class="pulse" cx="20" cy="18" r="6" fill="#22c55e"/>
        <text x="37" y="23" fill="#bfdbfe" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">DEADZONE SYSTEMS ONLINE</text>
      </g>

      <text class="title" x="0" y="126" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="1">MOHAMMED MEZO</text>
      <rect x="0" y="149" width="770" height="6" rx="3" fill="url(#accent)" filter="url(#softGlow)"/>
      <text x="0" y="207" fill="#67e8f9" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="800" letter-spacing="4.4">ANDROID SYSTEMS ENGINEER</text>
      <text x="0" y="252" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600">AOSP • HyperOS • OnePlus • ODM Porting • ROM Automation</text>

      <g transform="translate(0 298)">
        <rect width="196" height="48" rx="24" fill="#0b2452" stroke="#3b82f6"/>
        <text x="98" y="30" text-anchor="middle" fill="#dbeafe" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900">DEADZONE FOUNDER</text>
        <rect x="212" width="190" height="48" rx="24" fill="#28134e" stroke="#8b5cf6"/>
        <text x="307" y="30" text-anchor="middle" fill="#ede9fe" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900">ROM ENGINEERING</text>
        <rect x="418" width="205" height="48" rx="24" fill="#063d3b" stroke="#14b8a6"/>
        <text x="520.5" y="30" text-anchor="middle" fill="#ccfbf1" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900">BUILD AUTOMATION</text>
      </g>

      <text x="0" y="407" fill="#94a3b8" font-family="monospace" font-size="16">root@deadzone:~$ build --clean --verify --ship</text>
      <rect class="blink" x="477" y="391" width="10" height="20" rx="1" fill="#22d3ee"/>
    </g>

    <g class="float">
      <g transform="translate(1125 245)">
        <circle r="119" fill="#020617" stroke="#334155" stroke-width="2"/>
        <circle r="93" fill="#071426" stroke="url(#accent)" stroke-width="2" filter="url(#softGlow)"/>
        <path d="M-46 43V-43L0-2L46-43V43" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="10" fill="#f8fafc" filter="url(#softGlow)"/>
        <text x="0" y="72" text-anchor="middle" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="4">DEADZONE</text>
      </g>
      <g class="orbit">
        <ellipse cx="1125" cy="245" rx="170" ry="62" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".65"/>
        <circle cx="1295" cy="245" r="8" fill="#22d3ee" filter="url(#softGlow)"/>
      </g>
      <g class="orbit2">
        <ellipse cx="1125" cy="245" rx="74" ry="172" fill="none" stroke="#a855f7" stroke-width="2" opacity=".6"/>
        <circle cx="1125" cy="73" r="8" fill="#c084fc" filter="url(#softGlow)"/>
      </g>
    </g>

    <rect class="scan" x="0" y="0" width="1400" height="70" fill="url(#accent)" opacity=".08"/>
    <rect x="1" y="1" width="1398" height="518" rx="31" fill="none" stroke="#334155" stroke-width="2"/>
  </g>
</svg>