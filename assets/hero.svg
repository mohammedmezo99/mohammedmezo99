<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Mohammed MEZO — Executive Engineering Portfolio</title>
<desc id="desc">Animated executive banner presenting Mohammed MEZO as a programmer since 2008, engineering leader, game developer, app developer, web developer, Android systems engineer and AI builder.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020617"/><stop offset=".46" stop-color="#071a33"/><stop offset="1" stop-color="#170926"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22d3ee"/><stop offset=".38" stop-color="#3b82f6"/><stop offset=".72" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/>
  </linearGradient>
  <radialGradient id="blue"><stop stop-color="#2563eb" stop-opacity=".6"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
  <radialGradient id="violet"><stop stop-color="#9333ea" stop-opacity=".5"/><stop offset="1" stop-color="#9333ea" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#60a5fa" stroke-width="1" opacity=".1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="clip"><rect width="1400" height="560" rx="34"/></clipPath>
  <style>
    .spin{transform-origin:1150px 280px;animation:spin 15s linear infinite}.spin2{transform-origin:1150px 280px;animation:back 22s linear infinite}.pulse{animation:pulse 2s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}.scan{animation:scan 5.5s ease-in-out infinite}.dash{stroke-dasharray:14 10;animation:dash 2.4s linear infinite}.blink{animation:blink 1s steps(2,end) infinite}.role1{animation:r1 12s infinite}.role2{animation:r2 12s infinite}.role3{animation:r3 12s infinite}.role4{animation:r4 12s infinite}.role5{animation:r5 12s infinite}.role6{animation:r6 12s infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes back{to{transform:rotate(-360deg)}}@keyframes pulse{0%,100%{opacity:.38}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes scan{0%,100%{transform:translateY(-90px);opacity:0}15%{opacity:.7}85%{transform:translateY(570px);opacity:.08}}@keyframes dash{to{stroke-dashoffset:-48}}@keyframes blink{50%{opacity:0}}
    @keyframes r1{0%,14%{opacity:1}17%,100%{opacity:.22}}@keyframes r2{0%,14%{opacity:.22}17%,30%{opacity:1}33%,100%{opacity:.22}}@keyframes r3{0%,30%{opacity:.22}33%,46%{opacity:1}49%,100%{opacity:.22}}@keyframes r4{0%,46%{opacity:.22}49%,62%{opacity:1}65%,100%{opacity:.22}}@keyframes r5{0%,62%{opacity:.22}65%,78%{opacity:1}81%,100%{opacity:.22}}@keyframes r6{0%,78%{opacity:.22}81%,96%{opacity:1}100%{opacity:.22}}
    @media(prefers-reduced-motion:reduce){.spin,.spin2,.pulse,.float,.scan,.dash,.blink,.role1,.role2,.role3,.role4,.role5,.role6{animation:none}}
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1400" height="560" fill="url(#bg)"/><rect width="1400" height="560" fill="url(#grid)"/>
  <circle cx="170" cy="80" r="320" fill="url(#blue)" filter="url(#blur)"><animate attributeName="cx" values="140;330;140" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="1250" cy="485" r="340" fill="url(#violet)" filter="url(#blur)"><animate attributeName="cy" values="470;320;470" dur="12s" repeatCount="indefinite"/></circle>
  <path class="dash" d="M0 468 C260 365 445 545 720 430 S1120 375 1400 455" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".48"/>

  <g transform="translate(76 62)">
    <rect width="296" height="38" rx="19" fill="#071426" stroke="#2563eb"/><circle class="pulse" cx="21" cy="19" r="6" fill="#22c55e"/>
    <text x="38" y="25" fill="#dbeafe" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.4">EXECUTIVE ENGINEERING SYSTEM ONLINE</text>

    <text x="0" y="132" fill="#f8fafc" font-family="Arial,sans-serif" font-size="72" font-weight="900" letter-spacing="1">MOHAMMED MEZO</text>
    <rect x="0" y="154" width="790" height="6" rx="3" fill="url(#accent)" filter="url(#glow)"/>
    <text x="0" y="207" fill="#67e8f9" font-family="Arial,sans-serif" font-size="25" font-weight="900" letter-spacing="4">FOUNDER • ENGINEERING LEAD • PRODUCT ARCHITECT</text>
    <text x="0" y="251" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="20" font-weight="600">Programmer since 2008 — building across games, apps, web, Android systems and AI</text>

    <g transform="translate(0 292)" font-family="Arial,sans-serif" font-size="14" font-weight="900">
      <g class="role1"><rect width="168" height="44" rx="22" fill="#0b2452" stroke="#3b82f6"/><text x="84" y="28" text-anchor="middle" fill="#dbeafe">🎮 GAME DEV</text></g>
      <g class="role2" transform="translate(180)"><rect width="168" height="44" rx="22" fill="#063d3b" stroke="#14b8a6"/><text x="84" y="28" text-anchor="middle" fill="#ccfbf1">📱 APP DEV</text></g>
      <g class="role3" transform="translate(360)"><rect width="168" height="44" rx="22" fill="#10263f" stroke="#22d3ee"/><text x="84" y="28" text-anchor="middle" fill="#cffafe">🌐 WEB DEV</text></g>
      <g class="role4" transform="translate(0 58)"><rect width="168" height="44" rx="22" fill="#28134e" stroke="#8b5cf6"/><text x="84" y="28" text-anchor="middle" fill="#ede9fe">🤖 ANDROID OS</text></g>
      <g class="role5" transform="translate(180 58)"><rect width="168" height="44" rx="22" fill="#3c1531" stroke="#ec4899"/><text x="84" y="28" text-anchor="middle" fill="#fce7f3">🧠 AI BUILDER</text></g>
      <g class="role6" transform="translate(360 58)"><rect width="168" height="44" rx="22" fill="#3b2a09" stroke="#f59e0b"/><text x="84" y="28" text-anchor="middle" fill="#fef3c7">⚙ AUTOMATION</text></g>
    </g>

    <text x="0" y="438" fill="#94a3b8" font-family="monospace" font-size="16">mezo@engineering:~$ architect --build --automate --ship</text><rect class="blink" x="565" y="421" width="10" height="21" fill="#22d3ee"/>
  </g>

  <g class="float">
    <circle cx="1150" cy="280" r="130" fill="#020617" stroke="#334155" stroke-width="2"/><circle cx="1150" cy="280" r="102" fill="#071426" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
    <path d="M1100 326V234L1150 278L1200 234V326" fill="none" stroke="url(#accent)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1150" cy="278" r="10" fill="#fff" filter="url(#glow)"/>
    <text x="1150" y="365" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13" font-weight="900" letter-spacing="4">DEADZONE</text>
    <g class="spin"><ellipse cx="1150" cy="280" rx="188" ry="70" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".64"/><circle cx="1338" cy="280" r="8" fill="#22d3ee" filter="url(#glow)"/></g>
    <g class="spin2"><ellipse cx="1150" cy="280" rx="82" ry="190" fill="none" stroke="#a855f7" stroke-width="2" opacity=".58"/><circle cx="1150" cy="90" r="8" fill="#c084fc" filter="url(#glow)"/></g>
  </g>
  <rect class="scan" width="1400" height="76" fill="url(#accent)" opacity=".07"/><rect x="1" y="1" width="1398" height="558" rx="33" fill="none" stroke="#334155" stroke-width="2"/>
</g>
</svg>