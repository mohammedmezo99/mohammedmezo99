<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#11142d"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset=".45" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.l{stroke-dasharray:14 10;animation:d 2s linear infinite}.hub{animation:p 2.5s ease-in-out infinite}.card{animation:f 4s ease-in-out infinite}.c2{animation-delay:.5s}.c3{animation-delay:1s}.c4{animation-delay:1.5s}@keyframes d{to{stroke-dashoffset:-48}}@keyframes p{50%{opacity:.72}}@keyframes f{50%{transform:translateY(-7px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
