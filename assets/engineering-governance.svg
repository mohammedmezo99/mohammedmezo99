<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="t d"><title id="t">Engineering governance system</title><desc id="d">Operating model and engineering principles for product delivery.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".5" stop-color="#07182f"/><stop offset="1" stop-color="#130b2b"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.flow{stroke-dasharray:16 12;animation:f 2.1s linear infinite}.pulse{animation:p 2.8s ease-in-out infinite}.p2{animation-delay:.35s}.p3{animation-delay:.7s}.p4{animation-delay:1.05s}.p5{animation-delay:1.4s}.p6{animation-delay:1.75s}.p7{animation-delay:2.1s}@keyframes f{to{stroke-dashoffset:-56}}@keyframes p{50%{opacity:.72}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1400" height="780" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="778" rx="29" fill="none" stroke="#334155" stroke-width="2"/><text x="700" y="56" text-anchor="middle" fill="#fff" font-family="Arial" font-size="28" font-weight="900" letter-spacing="4">ENGINEERING GOVERNANCE SYSTEM</text><text x="700" y="90" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16">Architecture, quality, integrity and delivery governed as one continuous lifecycle</text><path class="flow" d="M105 205 H1295" fill="none" stroke="url(#a)" stroke-width="5" filter="url(#g)"/><g font-family="Arial" text-anchor="middle"><g class="pulse"><circle cx="110" cy="205" r="24" fill="#071426" stroke="#22d3ee" stroke-width="4"/><text x="110" y="212" fill="#fff" font-size="16" font-weight="900">01</text><text x="110" y="260" fill="#67e8f9" font-size="14" font-weight="900">VISION</text><text x="110" y="282" fill="#94a3b8" font-size="12">Direction &amp; value</text></g><g class="pulse p2"><circle cx="305" cy="205" r="24" fill="#071426" stroke="#38bdf8" stroke-width="4"/><text x="305" y="212" fill="#fff" font-size="16" font-weight="900">02</text><text x="305" y="260" fill="#7dd3fc" font-size="14" font-weight="900">ARCHITECTURE</text><text x="305" y="282" fill="#94a3b8" font-size="12">Boundaries &amp; ownership</text></g><g class="pulse p3"><circle cx="500" cy="205" r="24" fill="#071426" stroke="#3b82f6" stroke-width="4"/><text x="500" y="212" fill="#fff" font-size="16" font-weight="900">03</text><text x="500" y="260" fill="#93c5fd" font-size="14" font-weight="900">ENGINEERING</text><text x="500" y="282" fill="#94a3b8" font-size="12">Build &amp; integration</text></g><g class="pulse p4"><circle cx="695" cy="205" r="24" fill="#071426" stroke="#6366f1" stroke-width="4"/><text x="695" y="212" fill="#fff" font-size="16" font-weight="900">04</text><text x="695" y="260" fill="#c4b5fd" font-size="14" font-weight="900">AUTOMATION</text><text x="695" y="282" fill="#94a3b8" font-size="12">Quality gates</text></g><g class="pulse p5"><circle cx="890" cy="205" r="24" fill="#071426" stroke="#8b5cf6" stroke-width="4"/><text x="890" y="212" fill="#fff" font-size="16" font-weight="900">05</text><text x="890" y="260" fill="#d8b4fe" font-size="14" font-weight="900">INTEGRITY</text><text x="890" y="282" fill="#94a3b8" font-size="12">Security &amp; validation</text></g><g class="pulse p6"><circle cx="1085" cy="205" r="24" fill="#071426" stroke="#a855f7" stroke-width="4"/><text x="1085" y="212" fill="#fff" font-size="16" font-weight="900">06</text><text x="1085" y="260" fill="#e9d5ff" font-size="14" font-weight="900">RELEASE</text><text x="1085" y="282" fill="#94a3b8" font-size="12">Governed delivery</text></g><g class="pulse p7"><circle cx="1280" cy="205" r="24" fill="#071426" stroke="#ec4899" stroke-width="4"/><text x="1280" y="212" fill="#fff" font-size="16" font-weight="900">07</text><text x="1280" y="260" fill="#f0abfc" font-size="14" font-weight="900">EVOLUTION</text><text x="1280" y="282" fill="#94a3b8" font-size="12">Support &amp; iteration</text></g></g><g font-family="Arial"><rect x="65" y="350" width="610" height="150" rx="22" fill="#071827" stroke="#22d3ee"/><text x="95" y="390" fill="#fff" font-size="20" font-weight="900">🏛️ ARCHITECTURE BEFORE COMPLEXITY</text><text x="95" y="425" fill="#cbd5e1" font-size="15">Structure, boundaries, ownership and interfaces come</text><text x="95" y="449" fill="#cbd5e1" font-size="15">before feature expansion or technical acceleration.</text><text x="95" y="477" fill="#67e8f9" font-size="13" font-weight="800">OUTCOME  Clear systems that remain understandable as they grow.</text><rect x="725" y="350" width="610" height="150" rx="22" fill="#0a1835" stroke="#3b82f6"/><text x="755" y="390" fill="#fff" font-size="20" font-weight="900">⚙️ AUTOMATION BEFORE REPETITION</text><text x="755" y="425" fill="#cbd5e1" font-size="15">Repeated work becomes a controlled tool, pipeline or</text><text x="755" y="449" fill="#cbd5e1" font-size="15">workflow with visible state, ownership and failure handling.</text><text x="755" y="477" fill="#93c5fd" font-size="13" font-weight="800">OUTCOME  Faster delivery with lower operational risk.</text><rect x="65" y="530" width="610" height="150" rx="22" fill="#181334" stroke="#8b5cf6"/><text x="95" y="570" fill="#fff" font-size="20" font-weight="900">✅ EVIDENCE BEFORE RELEASE</text><text x="95" y="605" fill="#cbd5e1" font-size="15">Validation, traceability, checksums, permissions and rollback</text><text x="95" y="629" fill="#cbd5e1" font-size="15">are part of release readiness—not post-release cleanup.</text><text x="95" y="657" fill="#d8b4fe" font-size="13" font-weight="800">OUTCOME  Releases that can be trusted, audited and supported.</text><rect x="725" y="530" width="610" height="150" rx="22" fill="#0a2022" stroke="#10b981"/><text x="755" y="570" fill="#fff" font-size="20" font-weight="900">🤖 AI AS CONTROLLED INFRASTRUCTURE</text><text x="755" y="605" fill="#cbd5e1" font-size="15">AI is embedded where it creates reliable leverage, while</text><text x="755" y="629" fill="#cbd5e1" font-size="15">critical actions remain permission-aware and supervised.</text><text x="755" y="657" fill="#6ee7b7" font-size="13" font-weight="800">OUTCOME  Intelligent execution without surrendering control.</text></g><rect x="120" y="715" width="1160" height="38" rx="19" fill="#071426" stroke="url(#a)"/><text x="700" y="740" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="14" font-weight="900" letter-spacing="1.4">PRODUCTS, NOT DEMOS • OWNERSHIP END TO END • INTEGRITY BY DESIGN • IMPROVE THE SYSTEM</text></svg>