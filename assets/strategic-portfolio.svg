<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="t d"><title id="t">Strategic engineering portfolio</title><desc id="d">Executive overview of Mohammed MEZO engineering domains and private-by-design systems.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".5" stop-color="#071b35"/><stop offset="1" stop-color="#170b2d"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset=".45" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.card{animation:float 5s ease-in-out infinite}.d2{animation-delay:.6s}.d3{animation-delay:1.2s}.d4{animation-delay:1.8s}.d5{animation-delay:2.4s}.d6{animation-delay:3s}.scan{animation:scan 5s linear infinite}@keyframes float{50%{transform:translateY(-7px)}}@keyframes scan{0%{transform:translateX(-1400px);opacity:0}20%{opacity:.18}80%{opacity:.18}100%{transform:translateX(1400px);opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1400" height="820" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="818" rx="29" fill="none" stroke="#334155" stroke-width="2"/><text x="700" y="58" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="28" font-weight="900" letter-spacing="4">STRATEGIC ENGINEERING PORTFOLIO</text><text x="700" y="92" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="16">Product architecture • private infrastructure • controlled delivery • long-term ownership</text><g font-family="Arial"><g class="card"><rect x="55" y="135" width="410" height="255" rx="24" fill="#071827" stroke="#22d3ee"/><text x="85" y="180" fill="#fff" font-size="23" font-weight="900">🧬 DEADZONE PLATFORM</text><text x="85" y="216" fill="#67e8f9" font-size="15" font-weight="800">ANDROID SYSTEMS & ROM ENGINEERING</text><text x="85" y="255" fill="#cbd5e1" font-size="15">Architecture, framework integration, device</text><text x="85" y="279" fill="#cbd5e1" font-size="15">adaptation, validation and release governance.</text><text x="85" y="322" fill="#94a3b8" font-size="14">ROLE  Founder & Engineering Lead</text><text x="85" y="347" fill="#94a3b8" font-size="14">ACCESS  Controlled distribution</text></g><g class="card d2"><rect x="495" y="135" width="410" height="255" rx="24" fill="#0a1835" stroke="#3b82f6"/><text x="525" y="180" fill="#fff" font-size="23" font-weight="900">⚙️ BUILD FACTORY</text><text x="525" y="216" fill="#93c5fd" font-size="15" font-weight="800">PRIVATE RELEASE INFRASTRUCTURE</text><text x="525" y="255" fill="#cbd5e1" font-size="15">Extraction, patch orchestration, quality gates,</text><text x="525" y="279" fill="#cbd5e1" font-size="15">packaging, signing and controlled delivery.</text><text x="525" y="322" fill="#94a3b8" font-size="14">ROLE  Automation Architect</text><text x="525" y="347" fill="#94a3b8" font-size="14">ACCESS  Private by design</text></g><g class="card d3"><rect x="935" y="135" width="410" height="255" rx="24" fill="#1b1437" stroke="#8b5cf6"/><text x="965" y="180" fill="#fff" font-size="23" font-weight="900">🤖 MEZO AI SYSTEMS</text><text x="965" y="216" fill="#d8b4fe" font-size="15" font-weight="800">INTELLIGENT ENGINEERING OPERATIONS</text><text x="965" y="255" fill="#cbd5e1" font-size="15">Agents, connected tools, supervised actions</text><text x="965" y="279" fill="#cbd5e1" font-size="15">and permission-aware workflow automation.</text><text x="965" y="322" fill="#94a3b8" font-size="14">ROLE  AI Product Builder</text><text x="965" y="347" fill="#94a3b8" font-size="14">ACCESS  Private product systems</text></g><g class="card d4"><rect x="55" y="430" width="410" height="255" rx="24" fill="#0b2024" stroke="#10b981"/><text x="85" y="475" fill="#fff" font-size="23" font-weight="900">🛍️ DIGITAL COMMERCE</text><text x="85" y="511" fill="#6ee7b7" font-size="15" font-weight="800">BUSINESS PLATFORM ENGINEERING</text><text x="85" y="550" fill="#cbd5e1" font-size="15">Catalogs, orders, dashboards, operations,</text><text x="85" y="574" fill="#cbd5e1" font-size="15">analytics, deployment and automation.</text><text x="85" y="617" fill="#94a3b8" font-size="14">ROLE  Product & Platform Lead</text><text x="85" y="642" fill="#94a3b8" font-size="14">ACCESS  Commercial systems</text></g><g class="card d5"><rect x="495" y="430" width="410" height="255" rx="24" fill="#251928" stroke="#f59e0b"/><text x="525" y="475" fill="#fff" font-size="23" font-weight="900">🎮 GAME SYSTEMS</text><text x="525" y="511" fill="#fcd34d" font-size="15" font-weight="800">INTERACTIVE PRODUCT ENGINEERING</text><text x="525" y="550" fill="#cbd5e1" font-size="15">Mechanics, timing, real-time logic, feedback,</text><text x="525" y="574" fill="#cbd5e1" font-size="15">performance and experience architecture.</text><text x="525" y="617" fill="#94a3b8" font-size="14">ROLE  Game Systems Developer</text><text x="525" y="642" fill="#94a3b8" font-size="14">ACCESS  Private portfolio</text></g><g class="card d6"><rect x="935" y="430" width="410" height="255" rx="24" fill="#20122e" stroke="#ec4899"/><text x="965" y="475" fill="#fff" font-size="23" font-weight="900">🌐 WEB PLATFORMS</text><text x="965" y="511" fill="#f0abfc" font-size="15" font-weight="800">FULL-STACK PRODUCT DELIVERY</text><text x="965" y="550" fill="#cbd5e1" font-size="15">Web products, APIs, dashboards, control</text><text x="965" y="574" fill="#cbd5e1" font-size="15">panels, security and deployment governance.</text><text x="965" y="617" fill="#94a3b8" font-size="14">ROLE  Full-Stack Architect</text><text x="965" y="642" fill="#94a3b8" font-size="14">ACCESS  Public & private systems</text></g></g><rect x="110" y="728" width="1180" height="50" rx="25" fill="#071426" stroke="url(#a)"/><text x="700" y="760" text-anchor="middle"