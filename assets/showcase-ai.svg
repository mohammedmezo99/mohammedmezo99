<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d"><title id="t">MEZO AI Systems</title><desc id="d">Public overview of private AI agents and controlled automation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".5" stop-color="#111336"/><stop offset="1" stop-color="#240b32"/></linearGradient><linearGradient id="a"><stop stop-color="#67e8f9"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient><style>.r{transform-origin:1040px 260px;animation:r 8s linear infinite}.p{animation:p 2.4s ease-in-out infinite}@keyframes r{to{transform:rotate(360deg)}}@keyframes p{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1400" height="520" rx="32" fill="url(#bg)"/><rect x="2" y="2" width="1396" height="516" rx="30" fill="none" stroke="#334155" stroke-width="3"/><text x="80" y="110" fill="#d8b4fe" font-family="Arial" font-size="20" font-weight="800" letter-spacing="4">INTELLIGENT ENGINEERING OPERATIONS</text><text x="80" y="185" fill="#fff" font-family="Arial" font-size="52" font-weight="900">MEZO AI SYSTEMS</text><text x="80" y="230" fill="#cbd5e1" font-family="Arial" font-size="21">Agents • connected tools • supervised execution • permission-aware automation</text><g class="r" fill="none" stroke="url(#a)"><circle cx="1040" cy="260" r="150" stroke-width="3" stroke-dasharray="12 10"/><circle cx="1040" cy="260" r="105" stroke-width="2" stroke-dasharray="8 8"/></g><circle class="p" cx="1040" cy="260" r="58" fill="#111827" stroke="#a855f7" stroke-width="4"/><text x="1040" y="270" text-anchor="middle" fill="#fff" font-family="Arial" font-size="25" font-weight="900">AI CORE</text><g fill="#67e8f9"><circle cx="1040" cy="110" r="12"/><circle cx="1190" cy="260" r="12"/><circle cx="1040" cy="410" r="12"/><circle cx="890" cy="260" r="12"/></g><rect x="80" y="300" width="650" height="105" rx="20" fill="#071426" stroke="#8b5cf6"/><text x="110" y="340" fill="#fff" font-family="Arial" font-size="19" font-weight="900">CONTEXT → POLICY → AGENTS → TOOLS → REVIEW</text><text x="110" y="375" fill="#94a3b8" font-family="Arial" font-size="16">Critical actions remain supervised, traceable and controlled.</text><rect x="80" y="438" width="1240" height="46" rx="23" fill="#071426" stroke="url(#a)"/><text x="700" y="468" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="15" font-weight="900" letter-spacing="2">PRIVATE PRODUCT SYSTEMS • PUBLIC ENGINEERING OVERVIEW • MOHAMMED MEZO</text></svg>