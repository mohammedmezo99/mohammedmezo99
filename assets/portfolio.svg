<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="t d">
<title id="t">Selected engineering work</title><desc id="d">Six animated local project cards for DeadZone ROM, build automation, AI, digital commerce, games and web platforms.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#130b2b"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.c{animation:p 4s ease-in-out infinite}.c2{animation-delay:.5s}.c3{animation-delay:1s}.c4{animation-delay:1.5s}.c5{animation-delay:2s}.c6{animation-delay:2.5s}@keyframes p{50%{opacity:.82;transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1400" height="650" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="648" rx="29" fill="none" stroke="#334155" stroke-width="2"/>
<text x="700" y="50" text-anchor="middle" fill="#fff" font-family="Arial" font-size="26" font-weight="900" letter-spacing="3">SELECTED ENGINEERING WORK</text>
<g font-family="Arial">
<g class="c"><rect x="50" y="90" width="410" height="230" rx="24" fill="#071827" stroke="#22d3ee"/><text x="80" y="132" fill="#fff" font-size="23" font-weight="900">🧬 DEADZONE ROM PLATFORM</text><text x="80" y="168" fill="#67e8f9" font-size="15" font-weight="800">ROLE • FOUNDER & ENGINEERING LEAD</text><text x="80" y="204" fill="#cbd5e1" font-size="15">Android systems, ROM architecture,</text><text x="80" y="228" fill="#cbd5e1" font-size="15">device adaptation and release governance.</text><text x="80" y="275" fill="#94a3b8" font-size="14">AOSP • HyperOS • Framework • Vendor • AVB</text></g>
<g class="c c2"><rect x="495" y="90" width="410" height="230" rx="24" fill="#0a1835" stroke="#3b82f6"/><text x="525" y="132" fill="#fff" font-size="23" font-weight="900">⚙️ BUILD FACTORY</text><text x="525" y="168" fill="#93c5fd" font-size="15" font-weight="800">ROLE • AUTOMATION ARCHITECT</text><text x="525" y="204" fill="#cbd5e1" font-size="15">Extraction, patching, validation, packaging,</text><text x="525" y="228" fill="#cbd5e1" font-size="15">checksums, artifacts and release pipelines.</text><text x="525" y="275" fill="#94a3b8" font-size="14">Python • Bash • GitHub Actions • Docker</text></g>
<g class="c c3"><rect x="940" y="90" width="410" height="230" rx="24" fill="#1c1437" stroke="#8b5cf6"/><text x="970" y="132" fill="#fff" font-size="23" font-weight="900">🤖 MEZO AI SYSTEMS</text><text x="970" y="168" fill="#d8b4fe" font-size="15" font-weight="800">ROLE • AI PRODUCT BUILDER</text><text x="970" y="204" fill="#cbd5e1" font-size="15">Agents, connected tools and intelligent</text><text x="970" y="228" fill="#cbd5e1" font-size="15">automation for engineering operations.</text><text x="970" y="275" fill="#94a3b8" font-size="14">AI Agents • APIs • Automation • Tooling</text></g>
<g class="c c4"><rect x="50" y="355" width="410" height="230" rx="24" fill="#0b2024" stroke="#10b981"/><text x="80" y="397" fill="#fff" font-size="23" font-weight="900">🛍️ DIGITAL COMMERCE</text><text x="80" y="433" fill="#6ee7b7" font-size="15" font-weight="800">ROLE • PRODUCT & PLATFORM LEAD</text><text x="80" y="469" fill="#cbd5e1" font-size="15">Catalogs, orders, dashboards, visual systems,</text><text x="80" y="493" fill="#cbd5e1" font-size="15">automation and business operations.</text><text x="80" y="540" fill="#94a3b8" font-size="14">Next.js • React • PostgreSQL • Cloud</text></g>
<g class="c c5"><rect x="495" y="355" width="410" height="230" rx="24" fill="#251928" stroke="#f59e0b"/><text x="525" y="397" fill="#fff" font-size="23" font-weight="900">🎮 GAME DEVELOPMENT LAB</text><text x="525" y="433" fill="#fcd34d" font-size="15" font-weight="800">ROLE • GAME SYSTEMS DEVELOPER</text><text x="525" y="469" fill="#cbd5e1" font-size="15">Gameplay logic, mechanics, performance,</text><text x="525" y="493" fill="#cbd5e1" font-size="15">interactive feedback and experience design.</text><text x="525" y="540" fill="#94a3b8" font-size="14">Real-time systems • Logic • Optimization</text></g>
<g class="c c6"><rect x="940" y="355" width="410" height="230" rx="24" fill="#20122e" stroke="#ec4899"/><text x="970" y="397" fill="#fff" font-size="23" font-weight="900">🌐 WEB PLATFORMS</text><text x="970" y="433" fill="#f0abfc" font-size="15" font-weight="800">ROLE • FULL-STACK ARCHITECT</text><text x="970" y="469" fill="#cbd5e1" font-size="15">Websites, dashboards, APIs, control panels,</text><text x="970" y="493" fill="#cbd5e1" font-size="15">deployment systems and product surfaces.</text><text x="970" y="540" fill="#94a3b8" font-size="14">TypeScript • Node.js • Cloudflare • Vercel</text></g>
</g></svg>