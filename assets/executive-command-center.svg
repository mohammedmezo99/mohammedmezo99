<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">Mohammed MEZO Executive Engineering Command Center</title>
<desc id="desc">Animated executive dashboard presenting programming since 2008, engineering leadership, multi-domain systems, private infrastructure and production delivery.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="0.5" stop-color="#07182f"/><stop offset="1" stop-color="#170b2e"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="0.45" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#334155" stroke-width="1" opacity="0.18"/></pattern>
  <style>
    .scan{animation:scan 5s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.p2{animation-delay:.45s}.p3{animation-delay:.9s}.p4{animation-delay:1.35s}.flow{stroke-dasharray:18 12;animation:flow 2.2s linear infinite}.blink{animation:blink 1s steps(2,end) infinite}
    @keyframes scan{0%{transform:translateX(-500px);opacity:0}20%{opacity:.16}80%{opacity:.16}100%{transform:translateX(1500px);opacity:0}}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes flow{to{stroke-dashoffset:-60}}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect width="1400" height="560" rx="30" fill="url(#bg)"/>
<rect width="1400" height="560" rx="30" fill="url(#grid)"/>
<rect x="1" y="1" width="1398" height="558" rx="29" fill="none" stroke="#334155" stroke-width="2"/>
<text x="70" y="62" fill="#f8fafc" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" letter-spacing="3">EXECUTIVE ENGINEERING COMMAND CENTER</text>
<text x="70" y="94" fill="#94a3b8" font-family="Arial,Helvetica,sans-serif" font-size="16">Founder-led systems engineering across Android, products, web, games, automation and AI</text>
<circle class="pulse" cx="1290" cy="61" r="7" fill="#22c55e"/><text x="1310" y="67" fill="#bbf7d0" font-family="monospace" font-size="14" font-weight="700">SYSTEMS ONLINE</text>

<g font-family="Arial,Helvetica,sans-serif">
  <g class="pulse"><rect x="60" y="135" width="300" height="140" rx="22" fill="#071827" stroke="#22d3ee"/><text x="88" y="174" fill="#67e8f9" font-size="15" font-weight="800">ENGINEERING FOUNDATION</text><text x="88" y="223" fill="#fff" font-size="42" font-weight="900">SINCE 2008</text><text x="88" y="252" fill="#94a3b8" font-size="14">Long-term product and systems practice</text></g>
  <g class="pulse p2"><rect x="390" y="135" width="300" height="140" rx="22" fill="#0a1835" stroke="#3b82f6"/><text x="418" y="174" fill="#93c5fd" font-size="15" font-weight="800">CURRENT ROLE</text><text x="418" y="213" fill="#fff" font-size="26" font-weight="900">FOUNDER</text><text x="418" y="243" fill="#fff" font-size="22" font-weight="900">ENGINEERING LEAD</text><text x="418" y="264" fill="#94a3b8" font-size="13">Architecture, quality and delivery ownership</text></g>
  <g class="pulse p3"><rect x="720" y="135" width="300" height="140" rx="22" fill="#181334" stroke="#8b5cf6"/><text x="748" y="174" fill="#d8b4fe" font-size="15" font-weight="800">ENGINEERING DOMAINS</text><text x="748" y="220" fill="#fff" font-size="40" font-weight="900">6 CORE</text><text x="748" y="250" fill="#94a3b8" font-size="14">Android • Apps • Web • Games • AI • Automation</text></g>
  <g class="pulse p4"><rect x="1050" y="135" width="290" height="140" rx="22" fill="#0a2022" stroke="#10b981"/><text x="1078" y="174" fill="#6ee7b7" font-size="15" font-weight="800">OPERATING MODEL</text><text x="1078" y="220" fill="#fff" font-size="34" font-weight="900">PRIVATE CORE</text><text x="1078" y="250" fill="#94a3b8" font-size="14">Controlled access • governed releases</text></g>
</g>

<path class="flow" d="M100 340 H1300" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <text x="120" y="326" fill="#67e8f9" font-size="13" font-weight="800">VISION</text><text x="350" y="326" fill="#7dd3fc" font-size="13" font-weight="800">ARCHITECTURE</text><text x="580" y="326" fill="#93c5fd" font-size="13" font-weight="800">ENGINEERING</text><text x="810" y="326" fill="#c4b5fd" font-size="13" font-weight="800">AUTOMATION</text><text x="1040" y="326" fill="#d8b4fe" font-size="13" font-weight="800">GOVERNANCE</text><text x="1280" y="326" fill="#f0abfc" font-size="13" font-weight="800">PRODUCTION</text>
</g>

<rect x="60" y="385" width="1280" height="120" rx="20" fill="#030817" stroke="#24324a"/>
<circle cx="88" cy="414" r="6" fill="#ef4444"/><circle cx="108" cy="414" r="6" fill="#f59e0b"/><circle cx="128" cy="414" r="6" fill="#22c55e"/>
<text x="160" y="420" fill="#64748b" font-family="monospace" font-size="13">mezo-executive-console</text>
<text x="85" y="455" fill="#67e8f9" font-family="monospace" font-size="16">$ mission --architect products --automate execution --govern quality --ship production</text>
<text x="85" y="486" fill="#bbf7d0" font-family="monospace" font-size="15">status: founder-led engineering systems ready for controlled delivery</text>
<rect class="blink" x="765" y="471" width="10" height="18" rx="1" fill="#22d3ee"/>
<rect class="scan" x="0" y="0" width="420" height="560" fill="url(#accent)" opacity="0.08"/>
</svg>