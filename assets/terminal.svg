<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="t d">
<title id="t">DeadZone build terminal animation</title>
<desc id="d">Animated terminal lines showing an Android ROM build and release workflow.</desc>
<defs>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
 <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .l1{animation:a1 9s steps(1,end) infinite}.l2{animation:a2 9s steps(1,end) infinite}.l3{animation:a3 9s steps(1,end) infinite}.l4{animation:a4 9s steps(1,end) infinite}.l5{animation:a5 9s steps(1,end) infinite}.l6{animation:a6 9s steps(1,end) infinite}
  .cur{animation:blink 1s steps(2,end) infinite}
  @keyframes a1{0%,8%{opacity:0}9%,100%{opacity:1}}
  @keyframes a2{0%,20%{opacity:0}21%,100%{opacity:1}}
  @keyframes a3{0%,34%{opacity:0}35%,100%{opacity:1}}
  @keyframes a4{0%,50%{opacity:0}51%,100%{opacity:1}}
  @keyframes a5{0%,66%{opacity:0}67%,100%{opacity:1}}
  @keyframes a6{0%,82%{opacity:0}83%,100%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.l1,.l2,.l3,.l4,.l5,.l6,.cur{animation:none}}
 </style>
</defs>
<rect width="1400" height="330" rx="26" fill="#020617"/>
<rect width="1400" height="58" rx="26" fill="url(#top)"/>
<rect y="34" width="1400" height="24" fill="url(#top)"/>
<circle cx="35" cy="29" r="8" fill="#ef4444"/><circle cx="62" cy="29" r="8" fill="#f59e0b"/><circle cx="89" cy="29" r="8" fill="#22c55e"/>
<text x="700" y="36" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="16" font-weight="700">deadzone-build — production pipeline</text>
<g font-family="monospace" font-size="20">
 <text class="l1" x="38" y="96" fill="#67e8f9">$ dz build --source hyperos --device auto --verify</text>
 <text class="l2" x="38" y="134" fill="#94a3b8">[01/05] Source metadata verified ✓</text>
 <text class="l3" x="38" y="172" fill="#94a3b8">[02/05] Framework and SystemUI patches applied ✓</text>
 <text class="l4" x="38" y="210" fill="#94a3b8">[03/05] Vendor / ODM compatibility resolved ✓</text>
 <text class="l5" x="38" y="248" fill="#94a3b8">[04/05] AVB-aware package and checksums generated ✓</text>
 <text class="l6" x="38" y="286" fill="#4ade80" filter="url(#g)">[05/05] RELEASE READY — DeadZone Cloud + Telegram ✓</text>
 <rect class="cur" x="694" y="269" width="12" height="22" rx="2" fill="#22d3ee"/>
</g>
<rect x="1" y="1" width="1398" height="328" rx="25" fill="none" stroke="#334155" stroke-width="2"/>
</svg>